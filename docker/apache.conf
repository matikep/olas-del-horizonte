ServerName localhost
ServerTokens Prod
ServerSignature Off

# Nunca servir directo: configuración, SQL, documentos (se entregan por descargar.php) ni archivos de despliegue.
<DirectoryMatch "^/var/www/html/(inc|sql|uploads|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(Dockerfile|docker-compose.*\.yml|README\.md|\.env.*)$">
    Require all denied
</FilesMatch>
