# Despliegue con Docker Compose (Coolify u otro servidor).
# Variables requeridas: DB_PASSWORD. En Coolify, activa TRUST_PROXY=1 (va detrás de Traefik).
# Persistencia: los volúmenes "uploads" (documentos adjuntos) y "db-data" (base de datos) sobreviven a
# redeploys y reinicios. No les cambies el nombre: Coolify crearía volúmenes nuevos y vacíos.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: comite
      DB_USER: comite
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - uploads:/var/www/html/uploads
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./sql            # MariaDB 10.11 + esquema (sql/Dockerfile)
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: comite
      MARIADB_USER: comite
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      # Las tablas se crean solo la primera vez (volumen vacío). Los datos de socios se importan aparte (ver README).
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  db-data:
